[project]
name = "deck-studio"
version = "0.2.0"
description = "Local AI editor for HTML and Beamer slide decks"
requires-python = ">=3.12,<3.13"
dependencies = [
    "claude-agent-sdk==0.2.174",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "pymupdf==1.28.2",
    "playwright==1.62.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-playwright==0.10.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
